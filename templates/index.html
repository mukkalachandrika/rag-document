<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RAG Document Q&A Assistant</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #1f3a8a 0%, #3b5fc0 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 48px 40px;
      max-width: 480px;
      width: 90%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
      text-align: center;
    }
    .icon { font-size: 56px; margin-bottom: 16px; }
    h1 { font-size: 24px; color: #1f3a8a; margin-bottom: 8px; }
    p { color: #666; font-size: 15px; margin-bottom: 32px; }
    .upload-area {
      border: 2px dashed #1f3a8a;
      border-radius: 12px;
      padding: 32px 20px;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 20px;
    }
    .upload-area:hover { background: #eef2fb; }
    .upload-area input { display: none; }
    .upload-area label {
      cursor: pointer;
      display: block;
      font-size: 15px;
      color: #1f3a8a;
      font-weight: 600;
    }
    .upload-area .sub { font-size: 13px; color: #888; margin-top: 6px; }
    .btn {
      background: #1f3a8a;
      color: white;
      border: none;
      padding: 14px 32px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      width: 100%;
      font-weight: 600;
      transition: background 0.2s;
    }
    .btn:hover { background: #163070; }
    .btn:disabled { background: #aaa; cursor: not-allowed; }
    #status {
      margin-top: 16px;
      font-size: 14px;
      color: #1f3a8a;
      font-weight: 500;
      min-height: 20px;
    }
    #filename { margin-top: 12px; font-size: 13px; color: #444; }
    .error { color: #c0392b !important; }
    .features {
      margin-top: 28px;
      text-align: left;
      background: #f5f7ff;
      border-radius: 10px;
      padding: 16px 20px;
    }
    .features h3 { font-size: 13px; color: #1f3a8a; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
    .features li { font-size: 13px; color: #555; margin-bottom: 6px; list-style: none; padding-left: 4px; }
    .features li::before { content: "✓ "; color: #1f3a8a; font-weight: bold; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📄</div>
    <h1>Document Q&A Assistant</h1>
    <p>Upload any PDF and ask questions about its content using AI — powered by RAG</p>

    <div class="upload-area" id="dropZone">
      <input type="file" id="pdfInput" accept=".pdf" />
      <label for="pdfInput">
        📁 Click to choose a PDF file
        <div class="sub">Supports text-based PDFs</div>
      </label>
    </div>

    <div id="filename"></div>
    <button class="btn" id="uploadBtn" onclick="uploadPDF()" disabled>Upload &amp; Process PDF</button>
    <div id="status"></div>

    <div class="features">
      <h3>How it works</h3>
      <ul>
        <li>PDF is split into chunks and embedded</li>
        <li>Your question is matched to relevant chunks</li>
        <li>LLaMA 3 answers using only your document</li>
        <li>Source excerpts shown with every answer</li>
      </ul>
    </div>
  </div>

  <script>
    const input = document.getElementById("pdfInput");
    const btn = document.getElementById("uploadBtn");
    const filenameDiv = document.getElementById("filename");

    input.addEventListener("change", () => {
      if (input.files.length > 0) {
        filenameDiv.textContent = "Selected: " + input.files[0].name;
        btn.disabled = false;
      }
    });

    async function uploadPDF() {
      const file = input.files[0];
      if (!file) return;

      const status = document.getElementById("status");
      btn.disabled = true;
      status.className = "";
      status.textContent = "⏳ Processing PDF... this may take a moment...";

      const formData = new FormData();
      formData.append("pdf", file);

      try {
        const res = await fetch("/upload", { method: "POST", body: formData });
        const data = await res.json();

        if (data.success) {
          status.textContent = `✅ Done! ${data.chunk_count} chunks indexed. Redirecting...`;
          setTimeout(() => window.location.href = "/chat", 1500);
        } else {
          status.className = "error";
          status.textContent = "❌ " + (data.error || "Upload failed");
          btn.disabled = false;
        }
      } catch (err) {
        status.className = "error";
        status.textContent = "❌ Network error. Is the server running?";
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
