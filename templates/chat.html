<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Document Q&A — {{ pdf_name }}</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f0f4ff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #1f3a8a;
      color: white;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    header h1 { font-size: 18px; }
    header .doc { font-size: 13px; opacity: 0.8; margin-top: 2px; }
    .new-btn {
      background: white;
      color: #1f3a8a;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
    }
    .chat-container {
      flex: 1;
      max-width: 760px;
      width: 100%;
      margin: 0 auto;
      padding: 24px 16px 140px 16px;
    }
    .message {
      margin-bottom: 18px;
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }
    .message.user { flex-direction: row-reverse; }
    .avatar {
      width: 36px; height: 36px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; flex-shrink: 0;
    }
    .user .avatar { background: #1f3a8a; color: white; }
    .bot .avatar { background: #e8edf7; }
    .bubble {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 14.5px;
      line-height: 1.7;
    }
    .user .bubble {
      background: #1f3a8a;
      color: white;
      border-bottom-right-radius: 2px;
    }
    .bot .bubble {
      background: white;
      color: #1a1a1a;
      border-bottom-left-radius: 2px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }
    .source-section {
      margin-top: 10px;
      padding: 10px 12px;
      background: #eef2fb;
      border-radius: 8px;
      font-size: 12.5px;
      color: #555;
      border-left: 3px solid #1f3a8a;
    }
    .source-section strong { color: #1f3a8a; display: block; margin-bottom: 4px; }
    .input-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: white;
      border-top: 1px solid #dce3f5;
      padding: 12px 16px 16px 16px;
    }
    .chips-row {
      max-width: 760px;
      margin: 0 auto 10px auto;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .chip {
      background: #eef2fb;
      border: 1.5px solid #c5d0f0;
      color: #1f3a8a;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 12.5px;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .chip:hover { background: #1f3a8a; color: white; border-color: #1f3a8a; }
    .input-inner {
      max-width: 760px;
      margin: 0 auto;
      display: flex;
      gap: 10px;
    }
    .input-inner input {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid #dce3f5;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }
    .input-inner input:focus { border-color: #1f3a8a; }
    .send-btn {
      background: #1f3a8a;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 18px;
      transition: background 0.2s;
    }
    .send-btn:hover { background: #163070; }
    .send-btn:disabled { background: #aaa; cursor: not-allowed; }
    .typing { opacity: 0.6; font-style: italic; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>📄 Document Q&amp;A Assistant</h1>
      <div class="doc">📎 {{ pdf_name }}</div>
    </div>
    <button class="new-btn" onclick="newDocument()">+ New Document</button>
  </header>

  <div class="chat-container" id="chatContainer">
    <div class="message bot">
      <div class="avatar">🤖</div>
      <div class="bubble">
        Hello! I've processed <strong>{{ pdf_name }}</strong>. Ask me anything about it and I'll answer using only its content. Try the quick prompts below!
      </div>
    </div>
  </div>

  <div class="input-bar">
    <div class="chips-row" id="chips">
      <div class="chip" onclick="askChip(this)">Summarize this document</div>
      <div class="chip" onclick="askChip(this)">What are the main topics?</div>
      <div class="chip" onclick="askChip(this)">List all key points</div>
      <div class="chip" onclick="askChip(this)">What conclusions are mentioned?</div>
    </div>
    <div class="input-inner">
      <input type="text" id="questionInput" placeholder="Ask a question about your document..." onkeydown="if(event.key==='Enter') sendQuestion()" />
      <button class="send-btn" id="sendBtn" onclick="sendQuestion()">➤</button>
    </div>
  </div>

  <script>
    function askChip(el) {
      document.getElementById("questionInput").value = el.textContent;
      sendQuestion();
    }

    async function sendQuestion() {
      const input = document.getElementById("questionInput");
      const question = input.value.trim();
      if (!question) return;

      addMessage(question, "user");
      input.value = "";
      document.getElementById("sendBtn").disabled = true;
      document.getElementById("chips").style.display = "none";

      const typingId = addMessage("Thinking...", "bot", true);

      try {
        const res = await fetch("/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question })
        });
        const data = await res.json();
        removeMessage(typingId);

        if (data.answer) {
          addMessageWithSource(data.answer, data.sources);
        } else {
          addMessage("❌ " + (data.error || "Something went wrong"), "bot");
        }
      } catch (err) {
        removeMessage(typingId);
        addMessage("❌ Network error. Please try again.", "bot");
      }

      document.getElementById("sendBtn").disabled = false;
      scrollToBottom();
    }

    function addMessage(text, role, isTyping = false) {
      const id = "msg_" + Date.now() + Math.random();
      const container = document.getElementById("chatContainer");
      const div = document.createElement("div");
      div.className = "message " + role;
      div.id = id;
      div.innerHTML = `
        <div class="avatar">${role === "user" ? "👤" : "🤖"}</div>
        <div class="bubble ${isTyping ? "typing" : ""}">${text}</div>
      `;
      container.appendChild(div);
      scrollToBottom();
      return id;
    }

    function addMessageWithSource(answer, sources) {
      const container = document.getElementById("chatContainer");
      const div = document.createElement("div");
      div.className = "message bot";
      let sourceHtml = "";
      if (sources && sources.length > 0) {
        const excerpt = sources[0].substring(0, 220).replace(/</g, "&lt;").replace(/>/g, "&gt;");
        sourceHtml = `<div class="source-section">
          <strong>📎 Source excerpt from document:</strong>
          ${excerpt}...
        </div>`;
      }
      const safeAnswer = answer.replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/\n/g, "<br>");
      div.innerHTML = `
        <div class="avatar">🤖</div>
        <div class="bubble">${safeAnswer}${sourceHtml}</div>
      `;
      container.appendChild(div);
      scrollToBottom();
    }

    function removeMessage(id) {
      const el = document.getElementById(id);
      if (el) el.remove();
    }

    function scrollToBottom() {
      window.scrollTo(0, document.body.scrollHeight);
    }

    async function newDocument() {
      await fetch("/reset", { method: "POST" });
      window.location.href = "/";
    }
  </script>
</body>
</html>
